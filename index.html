<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resolve na Cozinha · links</title>
<meta name="description" content="Achados de cozinha que resolvem de verdade. Links dos produtos mostrados nos vídeos.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#fff7f0; --card:#ffffff; --text:#1f1a17; --muted:#6b625c; --accent:#e4572e; --accent-2:#f6a04d; --border:#f0e3d8; --shadow:0 6px 24px rgba(31,26,23,.08); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17120f; --card:#211a16; --text:#f4ede7; --muted:#b2a69d; --border:#2e2521; --shadow:0 6px 24px rgba(0,0,0,.35); } }
  :root[data-theme="dark"] { --bg:#17120f; --card:#211a16; --text:#f4ede7; --muted:#b2a69d; --border:#2e2521; --shadow:0 6px 24px rgba(0,0,0,.35); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:28px 16px 48px; }
  header { text-align:center; margin-bottom:20px; }
  .avatar { width:88px; height:88px; border-radius:50%; display:block; margin:0 auto 10px; box-shadow:var(--shadow); }
  h1 { font-size:22px; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:15px; }
  .redes { display:flex; justify-content:center; gap:10px; margin:14px 0 4px; flex-wrap:wrap; }
  .redes a { font-size:14px; color:var(--accent); text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:999px; background:var(--card); }
  .aviso { font-size:15px; color:var(--text); text-align:center; margin:12px 0 22px; font-weight:600; }
  .card { display:grid; grid-template-columns:96px 1fr; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; margin-bottom:12px; box-shadow:var(--shadow); align-items:center; }
  .card img { width:96px; height:96px; object-fit:cover; border-radius:12px; background:#eee; }
  .card h2 { font-size:16px; margin:0 0 4px; line-height:1.3; }
  .meta { color:var(--muted); font-size:13px; margin-bottom:8px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:14px; padding:9px 14px; border-radius:10px; }
  .btn:active { transform:scale(.98); }
  .destaque { border-color:var(--accent-2); }
  .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.3px; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
  footer { text-align:center; color:var(--muted); font-size:12px; margin-top:28px; }
  .vazio { text-align:center; color:var(--muted); padding:20px; }
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" src="img/marca.svg" alt="Resolve na Cozinha" width="88" height="88">
    <h1 id="nome">Resolve na Cozinha</h1>
    <p id="bio"></p>
    <nav class="redes" id="redes"></nav>
  </header>
  <p class="aviso" id="aviso"></p>
  <section id="lista" aria-live="polite"><p class="vazio">Carregando…</p></section>
  <footer>Preços conferidos na data do vídeo e podem mudar · links de afiliado #publi · página sem cookies</footer>
</main>
<script>
(async () => {
  // Canal de origem: a bio de cada rede aponta para ?c=ig, ?c=tt ou ?c=yt. Escolhe o link de afiliado com o sub_id certo.
  const canal = (new URLSearchParams(location.search).get('c') || 'ig').toLowerCase();
  const r = await fetch('links.json', { cache: 'no-store' });
  const data = await r.json();
  const p = data.perfil;
  document.getElementById('nome').textContent = p.nome;
  document.getElementById('bio').textContent = p.bio;
  document.getElementById('aviso').textContent = p.aviso;
  document.getElementById('redes').innerHTML = [
    ['Instagram', p.instagram], ['TikTok', p.tiktok], ['YouTube', p.youtube]
  ].filter(([, u]) => u).map(([n, u]) => `<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('');
  const lista = document.getElementById('lista');
  // Só produtos ativos (ativo !== false) e com algum link. Shopee fica oculta até a aprovação do programa.
  const prods = data.produtos.filter(x => x.ativo !== false && (x.links[canal] || x.fallback));
  if (!prods.length) { lista.innerHTML = '<p class="vazio">Links em breve.</p>'; return; }
  lista.innerHTML = prods.map(x => {
    const href = x.links[canal] || x.links.ig || x.fallback;
    return `<article class="card${x.destaque ? ' destaque' : ''}">
      <img src="${x.imagem}" alt="" loading="lazy" width="96" height="96">
      <div>
        ${x.destaque ? '<span class="tag">Mais pedido</span>' : ''}
        <h2>${x.nome}</h2>
        <div class="meta">${x.preco} · ${x.loja}</div>
        <a class="btn" href="${href}" target="_blank" rel="noopener sponsored" data-id="${x.id}">Ver na ${x.loja}</a>
      </div></article>`;
  }).join('');
})();
</script>
</body>
</html>
